# HRMP channels are intentionally opened after genesis by bootstrap-plan.sh.
[settings]
timeout = 1000
node_spawn_timeout = 300

[relaychain]
chain = "polkadot-local"
default_command = "polkadot"
default_args = ["--network-backend=libp2p", "--rpc-max-response-size=50"]

[relaychain.genesis.runtimeGenesis.patch.configuration.config]
executor_params = [{ EnabledHostFunction = "EccRfc163" }]

[[relaychain.nodes]]
name = "alice-relay"
validator = true
rpc_port = 12000

[[relaychain.nodes]]
name = "bob-relay"
validator = true
rpc_port = 12001

[[parachains]]
id = 1004
cumulus_based = true
chain = "people-polkadot-local"
chain_spec_path = "./specs/people-polkadot-local.raw.json"

[[parachains.collators]]
name = "people-alice"
command = "polkadot-omni-node"
rpc_port = 12010
args = ["--alice", "--authoring=slot-based", "--force-authoring", "--enable-statement-store", "-lxcm=debug"]

[[parachains]]
id = 1000
cumulus_based = true
chain = "asset-hub-polkadot-local"
chain_spec_path = "./specs/asset-hub-polkadot-local.raw.json"

[[parachains.collators]]
name = "asset-hub-bob"
command = "polkadot-omni-node"
rpc_port = 12020
args = ["--bob", "--authoring=slot-based", "--force-authoring", "--enable-statement-store", "-lxcm=debug"]

[[parachains]]
id = 1010
cumulus_based = true
chain = "bulletin-polkadot-local"
chain_spec_path = "./specs/bulletin-polkadot-local.raw.json"

[[parachains.collators]]
name = "bulletin-charlie"
command = "polkadot-omni-node"
rpc_port = 12030
args = ["--charlie", "--authoring=slot-based", "--force-authoring", "--enable-statement-store"]
